name: ARAL unified R3 full-site preview
on:
  push:
    branches:
      - codex/aral-home-hero48-cards-r15-20261028
    paths:
      - "design/hero/prototypes/hero-4s-k-views/ARAL_home_employer_feedback_r3_preview.html"
      - "index-employer-feedback-r3-preview.html"
      - "pages/*-employer-feedback-r3-preview.html"
      - "assets/aral-employer-feedback-r3.*"
      - "design/reviews/aral-unified-r3/**"
      - ".github/workflows/aral-unified-r3.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  chromium:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install Chromium
        run: |
          npm install --no-save --no-package-lock playwright@1.57.0
          npx playwright install --with-deps chromium
      - name: Start localhost server
        run: |
          python3 -m http.server 8123 --bind 127.0.0.1 >/tmp/aral-unified-r3.log 2>&1 &
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8123/design/hero/prototypes/hero-4s-k-views/ARAL_home_employer_feedback_r3_preview.html >/dev/null; then exit 0; fi
            sleep 1
          done
          exit 1
      - name: Test entire R3 site at four viewports
        run: node design/reviews/aral-unified-r3/check-site.mjs
      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aral-unified-r3-chromium
          path: review-output/aral-r3/
          if-no-files-found: warn
