name: PR9 Centered HERO visual QA
on:
  push:
    branches:
      - codex/aral-home-hero48-cards-r15-20261028
  workflow_dispatch:
permissions:
  contents: read
jobs:
  centered:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install Chromium
        run: |
          npm install --no-save --no-package-lock playwright@1.57.0
          npx playwright install --with-deps chromium
      - name: Start local static server
        run: |
          python3 -m http.server 8123 --bind 127.0.0.1 > /tmp/aral-hero-centered.log 2>&1 &
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8123/design/hero/prototypes/hero-4s-k-views/ARAL_home_hero_centered_preview.html >/dev/null; then break; fi
            sleep 1
          done
      - name: Compare actual original and centered HERO across four viewports
        run: node design/hero/prototypes/hero-4s-k-views/capture-centered-hero.mjs
      - name: Upload approval screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ARAL-PR9-centered-HERO-review
          path: review-output/hero-centered/
          if-no-files-found: warn
          retention-days: 30
