name: PR9 Contour 2A visual preview
on:
  push:
    branches:
      - codex/aral-home-hero48-cards-r15-20261028
  workflow_dispatch:
permissions:
  contents: read
jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install browser for visual tests
        run: |
          npm install --no-save --no-package-lock playwright@1.57.0
          npx playwright install --with-deps chromium
      - name: Start local preview server
        run: |
          python3 -m http.server 8123 --bind 127.0.0.1 >/tmp/aral-contour.log 2>&1 &
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8123/design/hero/prototypes/hero-4s-k-views/ARAL_home_contour_2A_preview.html >/dev/null; then break; fi
            sleep 1
          done
      - name: Verify contours, card integrity, hero and mobile UI
        run: node design/hero/prototypes/hero-4s-k-views/capture-contour-2A.mjs
      - name: Write preview directions
        if: always()
        run: |
          printf '%s\n' 'This is an isolated visual preview. Main and original ARAL pages are unchanged.' 'Homepage: design/hero/prototypes/hero-4s-k-views/ARAL_home_contour_2A_preview.html' 'Catalog: pages/products-r15-contour-2A-preview.html' 'Run from repository root: python3 -m http.server 8000' > review-output/OPEN-CONTOUR-2A.txt
      - name: Upload screenshots and reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ARAL-PR9-Contour-2A-Approval
          path: review-output/
          if-no-files-found: warn
          retention-days: 30
